<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/favicon.svg') }}">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  /> 
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <title>{{ title if title else "Portfolio - sashreek" }}</title>
</head>
<body class="site-root">
<nav class="site-nav shadow">
  <div class="max-w-4xl mx-auto px-4">
    <div class="flex items-center justify-between h-16">
      <a href="{{ url_for('index') }}" class="text-xl font-semibold site-brand">Sashreek's Portfolio</a>
      <div class="space-x-4">
        <a href="{{ url_for('index') }}" class="nav-link">Home</a>
        <a href="{{ url_for('projects') }}" class="nav-link">Projects</a>
        <a href="{{ url_for('about') }}" class="nav-link">About</a>
        <a href="{{ url_for('skills') }}" class="nav-link">Skills</a>
        <a href="{{ url_for('contact') }}" class="nav-link">Contact</a>
      </div>
    </div>
  </div>
</nav>
<main class="max-w-4xl mx-auto p-6">
  {% block content %}{% endblock %}
</main>
<footer class="text-center text-sm muted py-6">
  Built with Python + Tailwind
</footer>
</body>
</html>
